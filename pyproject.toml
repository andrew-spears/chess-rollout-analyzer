[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chessplan"
version = "0.1.0"
description = "Contrast two candidate chess moves by how soon each is followed up in Stockfish rollouts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "chess>=1.10,<2",
    "anywidget>=0.9",
    "ipywidgets>=8",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
